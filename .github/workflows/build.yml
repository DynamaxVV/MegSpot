name: Build/release

on:
  push:
    tags:
      - 'v*-vv*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
          cache: yarn

      - name: Activate Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.21 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Run repository self-checks
        shell: bash
        run: |
          BABEL_ENV=main node -r @babel/register src/renderer/utils/imagePairing.check.js
          BABEL_ENV=main node -r @babel/register src/renderer/utils/translationAnnotations.check.js
          BABEL_ENV=main node -r @babel/register src/renderer/utils/diagnosticLog.check.js

      - name: Pack main process
        run: npm run pack:main

      - name: Build web bundle
        run: npm run build:web

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    env:
      # All current public pre-release artifacts are intentionally unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win64
            artifact_glob: build/*-win-x64-portable.exe
          - os: ubuntu-latest
            target: linux
            artifact_glob: build/*.AppImage
          - os: macos-latest
            target: mac
            artifact_glob: build/*-mac-arm64.dmg

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
          cache: yarn

      - name: Activate Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.21 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build platform artifact
        run: npm run build:${{ matrix.target }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: megspot-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Create draft pre-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.exe *.AppImage *.dmg > SHA256SUMS

      - name: Create GitHub draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft \
            --prerelease \
            --generate-notes \
            --title "MegSpot $GITHUB_REF_NAME"
